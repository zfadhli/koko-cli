# Reasonix configuration.
# Resolution order: flag > ./reasonix.toml > ~/.reasonix/config.toml > built-in defaults.
# Secrets come from the environment via api_key_env; never put keys here.

config_version = 3   # schema marker for diagnostics; old versions may ignore it
default_model = "deepseek-flash"
# language      = "zh"   # ui/model language; empty = auto-detect from $LANG / $REASONIX_LANG

[agent]
# system_prompt = """..."""   # omit to use the built-in prompt for this version
# system_prompt_file = "prompts/system.md"   # overrides system_prompt when set
# max_steps         = 0   # executor tool-call rounds; 0 = no limit
# planner_max_steps = 12   # planner read-only tool-call rounds; 0 = no limit
temperature       = 0.0
auto_plan   = "off"   # off|on; off keeps plan mode manual
# reasoning_language = "zh"   # visible reasoning language: auto|zh|en
# auto_plan_classifier = "deepseek-flash"   # optional; only used for borderline tasks
soft_compact_ratio  = 0.5   # notice only; keeps cache-first prefix intact
compact_ratio       = 0.8   # try compacting when prompt reaches this fraction
compact_force_ratio = 0.9   # force compacting at this high-water mark
# keep                = ["errors"]   # compaction keep policy: errors, user_marked
# recent_keep         = 2   # minimum recent messages kept verbatim
cold_resume_prune   = true   # elide stale tool results when reopening a session past the provider cache window
# planner_model = "mimo"   # optional: enable two-model collaboration
# subagent_model = "deepseek-pro"   # optional default for runAs=subagent skills
# subagent_models = { review = "deepseek-pro", security_review = "deepseek-pro" }   # per-skill overrides
# subagent_effort = "high"   # optional default effort for subagents
# subagent_efforts = { review = "max", task = "high" }   # per-tool/skill effort overrides
# output_style = "explanatory"   # explanatory | learning | concise | custom; empty = default

[tools]
enabled = []   # empty = all built-in tools
bash_timeout_seconds = 120   # foreground safety cap; set 0 for no tool-local cap

[tools.background_jobs]
stalled_warning_seconds = 900   # warn once per background job after this many quiet seconds; 0 disables

[lsp]
enabled = true   # language server tools; servers launch lazily when used
# [lsp.servers.go]
# command = "gopls"
# args = []
# extensions = [".go"]

[skills]
# paths = ["~/my-skills", "../shared/skills"]   # extra custom skill roots
# excluded_paths = ["~/.agents/skills"]   # hide convention roots without deleting folders
# max_depth = 3   # nested scan depth; set 1 for legacy root-only discovery
# disabled_skills = ["review"]   # hide noisy or unwanted skills

[permissions]
# Per-call gating. mode = writer fallback when no rule matches: ask|allow|deny.
# Readers always default to allow. Precedence: deny > ask > allow > fallback.
# Rules are "Tool" or "Tool(specifier)"; e.g. Bash(go test:*), Edit(src/**).
mode  = "ask"
# deny = ["Bash(rm -rf*)", "Bash(git push*)"]   # hard-blocked in every mode
allow = ["Edit", "Bash(cd /home/envs4/workspaces/koko-cli && git status && git log --oneline -5)", "Bash(cd /home/envs4/workspaces/koko-cli && cat package.json | head -5)", "Bash(cd /home/envs4/workspaces/koko-cli && bun run typecheck 2>&1; bun run lint 2>&1; bun test 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && git branch -a)", "Bash(cd /home/envs4/workspaces/koko-cli && bun whoami 2>&1 || echo \"---\" && npm whoami --registry https://registry.npmjs.org 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && cat tsdown.config.ts 2>/dev/null || cat tsdown.config.js 2>/dev/null || echo \"no tsdown config found\")", "Bash(cd /home/envs4/workspaces/koko-cli && cat package.json)", "Bash(which gh 2>/dev/null && gh auth status 2>&1 || echo \"gh CLI not available\")", "Bash(git remote:*)", "Bash(cd /home/envs4/workspaces/koko-cli && gh secret list --repo zfadhli/koko-cli 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && gh release list --repo zfadhli/koko-cli --limit 5 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && gh workflow view publish.yml --repo zfadhli/koko-cli 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && gh run view 27614851149 --repo zfadhli/koko-cli --log --job 2>&1 | tail -20)", "Bash(curl -s https://registry.npmjs.org/@zfadhli/koko-cli | jq '.versions | keys | .[]' | tail -5)", "Bash(cd /home/envs4/workspaces/koko-cli && gh run view 27614851149 --repo zfadhli/koko-cli --log --job 28007741666 2>&1 | tail -30)", "Bash(cd /home/envs4/workspaces/koko-cli && npm view @zfadhli/koko-cli versions 2>&1)", "Bash(curl -s \"https://registry.npmjs.org/@zfadhli/koko-cli\" | python3 -c \"import sys,json; data=json.load(sys.stdin); versions=list(data['versions'].keys()); print('Latest:', max(versions, key=lambda v: tuple(map(int,v.lstrip('v').split('.')))), 'All:', versions)\")", "Bash(cd /home/envs4/workspaces/koko-cli && gh run view 27614851149 --repo zfadhli/koko-cli --log --job 28949724660 2>&1 | tail -30)", "Bash(cd /home/envs4/workspaces/koko-cli && gh run view 27614851149 --repo zfadhli/koko-cli --log 2>&1 | tail -20)", "Bash(curl -s \"https://registry.npmjs.org/@zfadhli/koko-cli/0.2.1\" | python3 -c \"import sys,json; pkg=json.load(sys.stdin); print('Provenance:', pkg.get('_hasProvenance', False), '| Attestations:', pkg.get('attestations', 'none') if 'attestations' in pkg else 'none')\")", "Bash(curl -s \"https://registry.npmjs.org/@zfadhli/koko-cli/0.2.0\" | python3 -c \"import sys,json; pkg=json.load(sys.stdin); print('Provenance:', pkg.get('_hasProvenance', False), '| Attestations:', pkg.get('attestations', 'none') if 'attestations' in pkg else 'none')\")", "Bash(cd /home/envs4/workspaces/koko-cli && gh run view 27614851149 --repo zfadhli/koko-cli 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && NODE_DEBUG=\"\" curl -s \"https://registry.npmjs.org/@zfadhli/koko-cli\" | python3 -c \"\nimport sys, json\ndata = json.load(sys.stdin)\nfor ver in ['0.1.0','0.2.0','0.2.1']:\n    v = data['versions'].get(ver,{})\n    deps = v.get('dependencies',{})\n    print(f'{ver}: dist-tag={ver}, deps={list(deps.keys())}')\" 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && gh run view --job=81648068796 --repo zfadhli/koko-cli --log 2>&1 | head -80)", "Bash(cd /home/envs4/workspaces/koko-cli && git status && git log --oneline -1)", "Bash(cd /home/envs4/workspaces/koko-cli && bun test 2>&1)", "Bash(curl -s \"https://registry.npmjs.org/@zfadhli/koko-cli\" | python3 -c \"\nimport sys, json\ndata = json.load(sys.stdin)\nversions = sorted(data['versions'].keys(), key=lambda v: tuple(map(int, v.split('.'))))\nprint('Published versions:', versions)\nprint('Latest:', versions[-1])\nfor v in versions:\n    pkg = data['versions'][v]\n    print(f'  {v}: provenance={pkg.get(\\\"_hasProvenance\\\", False)}, size={pkg.get(\\\"dist\\\",{}).get(\\\"unpackedSize\\\",\\\"?\\\")}')\" 2>&1)", "Bash(gh secret list --repo zfadhli/koko-cli 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && tsc --noEmit 2>&1 && biome check src tests 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && bun run typecheck 2>&1 && bun run lint 2>&1)", "Bash(curl -s \"https://registry.npmjs.org/@zfadhli/koko-cli\" | python3 -c \"import sys,json; print(json.load(sys.stdin)['versions'].keys() - {'0.1.0','0.2.0','0.2.1'})\")", "install_source", "Bash(grep -A1 'ponytail\\|caveman' /home/envs4/.reasonix/config.toml)", "Bash(cat /home/envs4/.reasonix/config.toml 2>&1 | tail -30)", "Bash(cd /home/envs4/workspaces/koko-cli && git ls-files dist/ tmp/)", "Bash(cd /home/envs4/workspaces/koko-cli && bun run format 2>&1)", "Bash(cd /home/envs4/workspaces/koko-cli && bun test && echo \"---\" && bun run typecheck && echo \"---\" && bun run lint)"]
# ask = ["Edit(src/**)"]   # force a prompt even if otherwise allowed

[sandbox]
# Confine tool blast radius. File-writers (write_file/edit_file/multi_edit/move_file)
# may only write under workspace_root (empty = current dir) and allow_write extras.
# bash = "enforce" (default) jails each command in an OS sandbox (macOS now;
# graceful fallback elsewhere); "off" disables it. network allows egress.
# workspace_root = ""            # default: current working directory
# allow_write = ["/tmp"]          # extra dirs writers may also modify
bash    = "enforce"
network = true

[statusline]
# A custom status line: a command whose first stdout line replaces the built-in
# data row. It receives {"model","contextUsed","contextWindow","cwd"} as JSON on stdin.
# command = "my-statusline.sh"

# External MCP servers. type: "stdio" (default, a subprocess) | "http" | "sse".
